# The AI runtime MCF installs for MiniMax Music 3, which runs through the
# diffusers library at the commit MiniMax names. uv.lock next to this file pins
# every package and its hash; the diffusers source is pinned in manifest.json.
[project]
name = "mcf-minimax-music3-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "diffusers",
    "transformers>=4.51",
    "accelerate>=1.10",
    "torch==2.7.1",
    "soundfile>=0.13.1",
    "safetensors",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
diffusers = { path = "diffusers" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
