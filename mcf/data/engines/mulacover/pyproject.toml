# The AI runtime MCF installs for MuLaCover. uv.lock next to this file pins
# every package and its hash; the MuLaCover source is pinned in manifest.json.
# MCF gives MuLaCover a lead sheet, never audio, so the audio extras
# (librosa, the YourMT3 transcriber) aren't installed.
[project]
name = "mcf-mulacover-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mulacover",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "soundfile>=0.13.1",
    "bitsandbytes==0.49.0",
    "safetensors",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
mulacover = { path = "mulacover" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
